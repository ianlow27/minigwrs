<button title="car[s]¬stor[y/ies]¬hat[/s]¬pet[|ition|ty]¬constan[cy/cies|t/ts|ce]¬cove[/s|r/rs] => car \n cars \n story \n stories \n hat \n hats \n pet \n petition \n petty \n constancy \n constancies \n constant \n constants \n constance \n cove \n coves \n cover \n covers
" onclick="expandWord()">expandWord</button>

<button title="achub = preserve^iv \n aflonyddu = disturb^iv \n amrywiol = various^aj => achub = preserve iv / aflonyddu = disturb iv / amrywiol = various aj" onclick="slashJoin()">slashJoin</button>
<button title="achub = preserve^iv \n aflonyddu = disturb^iv \n amrywiol = various^aj => |achub:preserve`iv|aflonyddu:disturb`iv|amrywiol:various`aj|" onclick="urlQuizJoin()">urlQuizJoin</button>
<button title="converts to Welsh accents" onclick="addAccentsFn()">addAccentsFn</button>
<button title="converts lesson text to outputs of extractWord, slashJoin, and urlQuizJoin in 1 click" onclick="lessonTxt2slashJoinAndUrlQuizJoin()">lessonTxt2slashJoinAndUrlQuizJoin</button>

<h2>Output</h2>
<textarea id="outputBox"></textarea>

<script>

function addAccents(text){
  return text 
    .replace(/a\^/g, "â")
    .replace(/e\^/g, "ê")
    .replace(/i\^/g, "î")
    .replace(/o\^/g, "ô")
    .replace(/u\^/g, "û")
    .replace(/w\^/g, "ŵ") .replace(/Y\^/g, "Ŵ") 
    .replace(/y\^/g, "ŷ") .replace(/W\^/g, "Ŷ")
    .replace(/a%/g, "ä") 
    .replace(/e%/g, "ë") 
    .replace(/i%/g, "ï") 
    .replace(/o%/g, "ö") 
    .replace(/u%/g, "ü")
    .replace(/y%/g, "ÿ");

}//endfunc
//===============================

function clean(text){
    return text
        .replace(/^[^\wŷŶŵŴÀ-ÿ']+/, "")
        .replace(/[)\s]+$/g,"")
        .trim();
}

function extractWord(txtinput){

    let input = txtinput;
    if (!txtinput) input = addAccents(document.getElementById("inputBox").value);

    const vocab = new Map();

    // ----------------------------
    // STEP 1: handle parentheses FIRST
    // ----------------------------
    const parenRegex = /\(([^)]*)\)/g;
    let match;

    while((match = parenRegex.exec(input)) !== null){

        let content = match[1];

        // CASE A: contains "="
        if(content.includes("=")){

            content.split("/").forEach(part => {

                if(part.includes("=")){

                    let [left, right] = part.split("=");

                    let word = clean(left).toLowerCase();
                    let meaning = clean(right);

                    if(word && meaning){
                        vocab.set(word, meaning);
                    }
                }
            });
        }

        // CASE B: no "=" → use preceding word
        else{

            let before = input.slice(0, match.index);
            let wordMatch = before.match(/([A-Za-zŷŶŵŴÀ-ÿ_\-']+)\s*$/);

            if(wordMatch){

                let word = wordMatch[1].toLowerCase();
                let meaning = clean(content);

                if(word && meaning){
                    vocab.set(word, meaning);
                }
            }
        }
    }

    // ----------------------------
    // STEP 2: REMOVE parentheses completely
    // ----------------------------
    input = input.replace(/\([^)]*\)/g, "");

    // ----------------------------
    // STEP 3: replace "/" with newlines
    // ----------------------------
    input = input.replace(/\//g, "\n");

    // ----------------------------
    // STEP 4: process remaining "=" lines
    // ----------------------------
    let lines = input.split("\n");

    lines.forEach(line => {

        line = clean(line);

        if(line.includes("=")){

            let [left, ...rest] = line.split("=");
            let right = rest.join("=");

            let wordMatch = left.match(/([A-Za-zŷŶŵŴÀ-ÿ_\-']+)\s*$/);

            if(wordMatch){

                let word = wordMatch[1].toLowerCase();
                let meaning = clean(right);

                if(word && meaning){
                    vocab.set(word, meaning);
                }
            }
        }
    });

    // ----------------------------
    // OUTPUT
    // ----------------------------
    const txtout = 
        [...new Set(
        [...vocab.entries()]
        .map(([w,m]) => `${w.toLowerCase() + " = " + m.toLowerCase()}` )
        .sort()
        )]
        .join("\n");
  if(!txtinput){
    document.getElementById("outputBox").value = txtout
  }else {
    return txtout;
  }
}


//=========================================================
function expandWord() {

    const input = addAccents(document.getElementById("inputBox").value.trim());
    //const input = document.getElementById("inputBox").value.trim();
    const output = [];

    if (!input) {
        document.getElementById("outputBox").value = "";
        return;
    }

    input.split("¬").forEach(word => {

        word = word.trim();
        if (!word) return;

        const m = word.match(/^(.*)\[(.*)\]$/);

        // No brackets
        if (!m) {
            output.push(word);
            return;
        }

        const stem = m[1];
        const inside = m[2];

        // Split alternative endings
        const pieces = inside.split("|");

        pieces.forEach(piece => {

            if (piece.includes("/")) {

                let [sing, plur] = piece.split("/");

                output.push(stem + sing);
                output.push(stem + plur);

            } else {

                if (piece === "") {
                    // Empty piece means original word
                    output.push(stem);
                }
                else {
                    // Single suffix
                    output.push(stem + piece);
                }

            }

        });

    });

    document.getElementById("outputBox").value = output.join("\n");
}//endfunc
//=======================================================
function sortLines(txtinput){
  let input = txtinput;
  if (!txtinput) input =  addAccents(document.getElementById("inputBox").value.trim());

  const lines = input.split("\n");
  lines.sort();
  const output = lines.join("\n");

  if(!txtinput){
    document.getElementById("outputBox").value = output;
  }else {
    return output;
  }
}//endfunc sortLines
//=======================================================
function slashJoin(txtinput){
  let input = txtinput;
  if (!txtinput) input = addAccents(document.getElementById("inputBox").value.trim());

  const lines = input.replace(/\n/g, " / ")
      .replace(/\^/g, " ")
      .replace(/ [\s]*/g, " ")
      ;
  const output = lines;

  if (!txtinput) document.getElementById("outputBox").value = output;
  else return output;
}//endfunc slashJoin
//=======================================================
function urlQuizJoin(txtinput){
  let input = txtinput;
  if (!txtinput) input = addAccents(document.getElementById("inputBox").value.trim());
  const lines = input.replace(/\n/g, " / ")
        .replace(/ [\s]*/g, " ") 
        .replace(/ = /g, ":") 
        .replace(/ \/ /g, "|") 
        .replace(/'/g, "\\'") 
        .replace(/ /g, "\`") 
        .replace(/\^/g, "\`") 
         ;
  const output = "|" + lines + "|";

  if (!txtinput){
    document.getElementById("outputBox").value = output;
  }else {
    return output;
  }
}//endfunc urlQuizJoin
//=======================================================
function addAccentsFn(){
  const input = addAccents(document.getElementById("inputBox").value.trim());

  const lines = input;
  const output = "" + lines + "";

  document.getElementById("outputBox").value = output;
}//endfunc addAccentsFn
